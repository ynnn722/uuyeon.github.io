# 기본 permalink (ai-103·기타 포스트는 _plugins/post_permalink.rb에서 덮어씀)
permalink: /:year:month:day/:title
url: https://ynnn722.github.io
baseurl: /uuyeon.github.io

# variables
name: Dev.Yeon
description: uuyeon's Blog
google_verification: null


# File management
include: [".htaccess"]
exclude: ["README.md", "LICENSE"]

# Sass
sass:
  style: :compressed
  sass_dir: _sass

# Markdown
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: true
  syntax_highlighter_opts:
    disable : true